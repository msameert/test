{% extends "base.html" %}

{% block body %}
<section class="error-page" aria-labelledby="error-title">
	<div class="error-code" aria-hidden="true">403</div>
	<div class="error-copy">
		<p class="eyebrow">Bad Request</p>
		<h1 id="error-title">The server cannot read data.</h1>
		<p>the server cannot process your request because the request syntax is invalid, corrupted, or too large.</p>
		<a href="{{ url_for('home') }}" class="error-action">Return home</a>
	</div>
</section>
{% endblock %}
