{% extends "base.html" %}

{% block body %}
<section class="error-page" aria-labelledby="error-title">
	<div class="error-code" aria-hidden="true">403</div>
	<div class="error-copy">
		<p class="eyebrow">Access restricted</p>
		<h1 id="error-title">You do not have access here.</h1>
		<p>Your account cannot open this resource. Return to the LMS home page or sign in with another account.</p>
		<a href="{{ url_for('home') }}" class="error-action">Return home</a>
	</div>
</section>
{% endblock %}
