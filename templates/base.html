<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon"type="image/x-icon" href="/favicon.ico">
</head>
<body>
    {% block header %}
    <header class="site-header">
        <div class="header-nav">
            <div class="brand" aria-label="LMS home">
                <div class="brand-mark">LMS</div>
                <div class="brand-copy">
                    <span class="app-title">Learning Management System</span>
                    <small>Student & Faculty Portal</small>
                </div>
            </div>
            <div class="nav-right">
                <span class="username-pill">Logged in as {{ session.get('username', 'Guest') }}</span>
                <a href="{{ url_for('logout') }}" class="logout-button">Logout</a>
            </div>
        </div>
    </header>
    {% endblock %}

    <main>
        <div class="page-wrapper">
            {% block body %}
            {% endblock %}
        </div>
    </main>

    {% block footer %}
    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-brand">LMS</span>
            <span>© 2026 Learning Management System</span>
        </div>
    </footer>
    {% endblock %}
</body>
</html>
